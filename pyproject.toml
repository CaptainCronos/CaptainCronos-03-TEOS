[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "teos"
dynamic = ["version"]
description = "Session-based technical education curriculum orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TEOS contributors" }]
keywords = ["curriculum", "education", "scheduling", "technical-education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "jsonschema>=4.20,<5",
    "python-docx>=1.1,<2",
    "PyYAML>=6,<7",
    "referencing>=0.35,<1",
    "reportlab>=4,<5",
]

[project.urls]
Homepage = "https://github.com/CaptainCronos/CaptainCronos-03-TEOS"
Repository = "https://github.com/CaptainCronos/CaptainCronos-03-TEOS"
Issues = "https://github.com/CaptainCronos/CaptainCronos-03-TEOS/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
teos = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "schemas"]
namespaces = true

[tool.setuptools.package-data]
schemas = ["*.schema.json"]

[tool.setuptools.dynamic]
version = { attr = "src.application.configuration.ENGINE_VERSION" }

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated behavior with no filesystem or component integration",
    "integration: interaction between multiple TEOS components or filesystem boundaries",
    "smoke: fast verification of a critical public command or surface",
    "end_to_end: complete workflow across the public application boundary",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["F"]
